name: Trading Bot

on:
  # schedule:
  #   # Test every 5 minutes, all 7 days
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # Required to commit state.json and data/

jobs:
  trade:
    runs-on: [self-hosted, oracle-vm-ib]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          TRADING212_ENVIRONMENT: demo
          LITE_LLM_BASE_URL: ${{ vars.LITE_LLM_BASE_URL || 'http://132.145.30.2:4000' }}
          LITE_LLM_MODEL: ${{ vars.LITE_LLM_MODEL || 'gpt-5.6-luna' }}
          LITE_LLM_API_KEY: ${{ secrets.LITE_LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m bot.main

      - name: Commit updated state and data
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@noreply.github.com"
          git add state.json data/
          git diff --staged --quiet || git commit -m "bot: update state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main
